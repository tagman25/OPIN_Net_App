name: Desktop app
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage
          - os: windows-latest
            args: --win portable
          - os: macos-latest
            args: --mac dmg zip --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx vite build --config vite.desktop.config.ts
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Check the Mac signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(ls release/*.dmg | head -1)
          hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/opin-dmg
          app=$(echo /tmp/opin-dmg/*.app)
          details=$(codesign -dv --verbose=4 "$app" 2>&1 || true)
          echo "$details"
          echo "$details" | grep -q "Signature=adhoc"
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil detach /tmp/opin-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: opin-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
